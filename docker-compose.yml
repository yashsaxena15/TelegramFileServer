services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:9000:8000"
    volumes:
      - ./src/frontend/dist:/app/src/frontend/dist
      - ./src/Backend:/app/src/Backend
      - ./src/Database:/app/src/Database
      - ./src/Config:/app/src/Config
      - ./src/Telegram:/app/src/Telegram
      - ./cache:/app/cache
      - ./.env:/app/.env
    depends_on:
      - mongo

volumes:
  mongo_data:
